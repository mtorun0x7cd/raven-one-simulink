version = 1

# The deposited thesis and its reading copy.
[[annotations]]
path = ["publication/Torun_Password_Keyless_Authentication.pdf", "publication/Torun_Password_Keyless_Authentication_reading-copy.pdf"]
precedence = "override"
SPDX-FileCopyrightText = "2021 Mert Torun"
SPDX-License-Identifier = "CC-BY-4.0"
SPDX-FileComment = "CC BY 4.0 is the licence of the catalogue record, https://doi.org/10.57683/EPUB-3598. It does not cover the material of third parties in the thesis: the figures NOTICE lists as third party or without a source, and the marks of TH Köln and of the partner company in the page headers."

# Documentation and metadata. CITATION.cff and codemeta.json quote the
# abstract of the thesis.
[[annotations]]
path = ["NOTICE", "ERRATA.md", "CITATION.cff", "codemeta.json", "publication/README.md", "publication/SHA256SUMS"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Mert Torun"
SPDX-License-Identifier = "CC-BY-4.0"

# Build configuration without room for a comment.
[[annotations]]
path = ["global.json"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Mert Torun"
SPDX-License-Identifier = "MIT"

# Verification. The data file is a transcription from Figure 32 of the thesis;
# the expected output belongs to the claim check.
[[annotations]]
path = ["verification/figure-32-ciphertext.txt"]
precedence = "closest"
SPDX-FileCopyrightText = "2021 Mert Torun"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = ["verification/expected-output.txt"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Mert Torun"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["verification/README.md"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Mert Torun"
SPDX-License-Identifier = "CC-BY-4.0"

# Figures 32 to 36 of the thesis, the author's own.
[[annotations]]
path = ["docs/figures/thesis-figure-*.png"]
precedence = "override"
SPDX-FileCopyrightText = "2021 Mert Torun"
SPDX-License-Identifier = "CC-BY-4.0"

# The handout of the colloquium, in German; not part of the deposited thesis.
[[annotations]]
path = ["slides/colloquium-handout-2021-07-05.de.pdf"]
precedence = "override"
SPDX-FileCopyrightText = "2021 Mert Torun"
SPDX-License-Identifier = "CC-BY-4.0"
SPDX-FileComment = "CC BY 4.0 does not cover the marks of TH Köln and of the partner company in the page headers, nor the table on page 1, which the handout's source [2] names; see NOTICE."
