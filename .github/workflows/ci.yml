name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build -c Release --nologo

      - name: Package build output
        # Directory.Build.props routes build output into the artifacts layout under
        # .tmp.nosync/, and the packaged deliverable is staged in .tmp.nosync/dist/
        # alongside it, so no build state lands in the source tree. The zip holds the
        # output tree itself, without the build-directory prefix.
        working-directory: .tmp.nosync/artifacts/bin/RavenOneSimuLink/release
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.tmp.nosync/dist"
          zip -r "$GITHUB_WORKSPACE/.tmp.nosync/dist/RavenOneSimuLink.zip" .

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: RavenOneSimuLink
          path: .tmp.nosync/dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: RavenOneSimuLink

      - name: Publish release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: RavenOneSimuLink.zip
          body: |
            Initial archived release (${{ github.ref_name }}) of Raven One SimuLink, an academic project preserved for reference. See the README for documentation.

            **Full Changelog**: https://github.com/mtorun0x7cd/raven-one-simulink/commits/${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
